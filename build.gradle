plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://maven.blamejared.com/"  }
    maven { url "https://modmaven.dev" }
    maven { url "https://maven.theillusivec4.top/" }
    maven { url "https://maven.confluence.ink/releases" }
    maven { url "https://maven.createmod.net" }
    maven { url "https://cursemaven.com" }
    maven { url "https://maven.bawnorton.com/releases" }
    maven { url "https://maven.enjarai.dev/mirrors" }

    maven {
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
    implementation("org.confluence.mod:ConfluenceOtherworld:${confluence_version}")
    implementation("org.confluence.lib:Confluence-Magic-Lib:${confluence_lib_version}")
    implementation("org.confluence:TerraEntity:${terra_entity_version}")
    implementation("org.confluence:TerraFurniture:${minecraft_version}-${terra_furniture_version}")
    implementation("org.confluence:TerraGuns:${minecraft_version}-${terra_guns_version}")
    implementation("org.confluence:TerraEntity:${terra_entity_version}")
    implementation("org.confluence:TerraCurio:${terra_curio_version}")
    implementation("com.xiaohunao:xhn_lib:1.21.1-${xhn_lib_version}")
    implementation("com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}")
    implementation("nowebsite.makertechno:TheTrackers:${minecraft_version}-${trackers_version}")
    implementation("org.mesdag:ParticleStorm:${particle_storm_version}")
    implementation("org.mesdag.thr_dim_particle:ThreeDimensionParticle-core:${tdpc_version}")

    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.1"))
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.7-beta.1")) {
        version {
            strictly '[0.3.7-beta.1,)'
            prefer '0.3.7-beta.1'
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
